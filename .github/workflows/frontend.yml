name: Frontend CI
on:
  push:
    branches: [ "main" ]
    paths: [ "frontend/**", "static/**", "templates/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "frontend/**", "static/**", "templates/**" ]
jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Vérifier la compilation
      run: go build -v ./...