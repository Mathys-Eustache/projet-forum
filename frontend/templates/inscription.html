{{define "inscription"}}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA TalkZone - Inscription</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/conference.css">
</head>
<body>
    <div class="site-layout">
        <div class="side-band band-blue"></div>

        <div class="main-content">
            <header class="nba-header">
                <div class="logo-container">
                    <a href="/"><img src="/static/assets/img/Logo_NBA_TalkZone.png" alt="Logo of NBA TalkZone" class="nba-logo"></a>
                </div>
                <nav class="nav-container">
                    <ul class="nav-menu">
                        <li><a href="/conference-ouest">Conférence Ouest</a></li>
                        <li><a href="/conference-est">Conférence Est</a></li>
                        <li><a href="/inscription">Inscription</a></li>
                        <li><a href="/connexion">Se connecter</a></li>
                    </ul>

                    <div class="search-box">
                        <form action="/search" method="GET">
                            <input type="text" name="q" placeholder="Rechercher..." required>
                            <button type="submit" class="search-btn"><img src="/static/assets/img/search_icon.png" alt="Search icon"></button>
                        </form>
                    </div>
                </nav>
            </header>

            <main class="conference-page">
                <section style="margin: 4rem auto; padding: 2rem; background-color: #fff; border-radius: 8px; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <h2 style="text-align: center; color: #1d428a; margin-bottom: 1.5rem;">Créer un compte</h2>
                    <div id="msg-erreur" style="color: red; margin-bottom: 1rem; text-align: center; display: none;"></div>
                    <div id="msg-succes" style="color: green; margin-bottom: 1rem; text-align: center; display: none;"></div>
                    
                    <form id="form-inscription" style="display: flex; flex-direction: column; gap: 15px;">
                        <input type="text" id="username" placeholder="Pseudo" required style="padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem;">
                        <input type="email" id="email" placeholder="Adresse email" required style="padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem;">
                        <input type="password" id="password" placeholder="Mot de passe" required style="padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem;">
                        <button type="submit" style="padding: 12px; background-color: #1d428a; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem;">S'inscrire</button>
                    </form>
                    <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">Déjà inscrit ? <a href="/connexion" style="color: #1d428a; text-decoration: none; font-weight: bold;">Connectez-vous</a></p>
                </section>
            </main>

            <footer class="site-footer">
                <p>© 2026 NBA TalkZone — Le forum n°1 en France pour les fans de NBA.</p>
            </footer>
        </div>

        <div class="side-band band-red"></div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
{{end}}
