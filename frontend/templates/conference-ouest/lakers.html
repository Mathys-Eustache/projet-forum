<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA TalkZone - Los Angeles Lakers</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/conference.css">
    <link rel="stylesheet" href="/static/css/franchise-pages.css">
</head>
<body class="team-page team-page--lakers">
    <div class="site-layout">
        <div class="side-band band-blue"></div>
        <div class="main-content">
            <header class="nba-header">
                <div class="logo-container">
                    <a href="/"><img src="/static/assets/img/Logo_NBA_TalkZone.png" alt="Logo of NBA TalkZone" class="nba-logo"></a>
                </div>
                <nav class="nav-container">
                    <ul class="nav-menu">
                        <li><a href="/categories">Catégories</a></li>
                        <li><a href="/conference-ouest">Conférence Ouest</a></li>
                        <li><a href="/conference-est">Conférence Est</a></li>
                        <li><a href="/inscription">Inscription</a></li>
                        <li><a href="/connexion">Se connecter</a></li>
                    </ul>
                    <div class="search-box">
                        <form action="/search" method="GET">
                            <input type="text" name="q" placeholder="Rechercher..." required>
                            <button type="submit" class="search-btn">🔍</button>
                        </form>
                    </div>
                </nav>
            </header>

            <main class="team-page-shell">
                <section class="franchise-hero">
                    <h1>Los Angeles Lakers</h1>
                    <p>Threads sur la franchise : Los Angeles Lakers</p>
                </section>
            </main>

            <footer class="site-footer">
                <p>© 2026 NBA TalkZone — Le forum n°1 en France pour les fans de NBA.</p>
                <div class="footer-links">
                    <a href="/mentions">Mentions légales</a>
                    <span>·</span>
                    <a href="/contact">Contact</a>
                </div>
            </footer>
        </div>
        <div class="side-band band-red"></div>
    </div>
