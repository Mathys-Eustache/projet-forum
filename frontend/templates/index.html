{{define "index"}}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA TalkZone</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <script src="/static/js/app.js" defer></script>

    <div class="site-layout">
        <div class="side-band band-blue"></div>
        
        <div class="main-content">
            
            <header class="nba-header">
                <div class="logo-container">
                    <a href="/"><img src="/static/assets/img/Logo_NBA_TalkZone.png" alt="Logo of NBA TalkZone" class="nba-logo"></a>
                </div>

                <nav class="nav-container">
                    <ul class="nav-menu">
                        <li><a href="/categories">Catégories</a></li>
                        <li><a href="/conference-ouest">Conférence Ouest</a></li>
                        <li><a href="/conference-est">Conférence Est</a></li>
                        <li id="nav-inscription"><a href="/inscription">Inscription</a></li>
                        <li id="nav-connexion"><a href="/connexion">Se connecter</a></li>
                    </ul>
                    
                    <div class="search-box">
                        <form action="/search" method="GET">
                            <input type="text" name="q" placeholder="Rechercher..." required>
                            <button type="submit" class="search-btn">🔍</button>
                        </form>
                    </div>
                </nav>
            </header>

            <main class="page-body">
                <h1 class="main-title">NBA TalkZone</h1>
                <section class="carousel-section">
                    <div class="carousel-header">
                        <h2>Thread à la une</h2>
                        <p>{{.ThreadHighlight}}</p>
                    </div>

                    <div class="carousel" id="carousel">
                        <button class="carousel-btn prev" type="button" aria-label="Précédent">&#8592;</button>

                        <div class="carousel-track">
                            <article class="carousel-slide active">
                                <a href="/{{.ThreadID}}" class="read-more-btn">
                                    <div class="image-wrapper">
                                        <img src="/static/assets/img/{{.ThreadID}}.jpg" alt="{{.ThreadTitle}}">
                                    </div>
                                </a> 
                            </article>
                            <article class="carousel-slide">
                                <a href="/{{.ThreadID}}" class="read-more-btn">
                                    <div class="image-wrapper">
                                        <img src="/static/assets/img/{{.ThreadID}}.jpg" alt="{{.ThreadTitle}}">
                                    </div>
                                </a>
                            </article>
                            <article class="carousel-slide">
                                <a href="/{{.ThreadID}}" class="read-more-btn">
                                    <div class="image-wrapper">
                                        <img src="/static/assets/img/{{.ThreadID}}.jpg" alt="{{.ThreadTitle}}">
                                    </div>
                                </a>
                            </article>
                        </div>

                        <button class="carousel-btn next" type="button" aria-label="Suivant">&#8594;</button>
                    </div>

                    <div class="carousel-dots" aria-label="Navigation du carrousel">
                        <button class="dot active" data-slide="0" aria-label="Slide 1"></button>
                        <button class="dot" data-slide="1" aria-label="Slide 2"></button>
                        <button class="dot" data-slide="2" aria-label="Slide 3"></button>
                    </div>
                </section>

                <section class="carousel-section">
                    <div class="carousel-header">
                        <h2>Joueurs stars</h2>
                    </div>

                    <div class="carousel" id="carousel">
                        <button class="carousel-btn prev" type="button" aria-label="Précédent">&#8592;</button>

                        <div class="carousel-track">
                            <article class="carousel-slide active">
                                <a href="/{{.ThreadID}}" class="read-more-btn">
                                    <div class="image-wrapper">
                                        <img src="/static/assets/img/{{.ThreadJS}}.jpg" alt="{{.ThreadJS}}">
                                    </div>
                                </a>
                            </article>
                            <article class="carousel-slide">
                                <a href="/{{.ThreadID}}" class="read-more-btn">
                                    <div class="image-wrapper">
                                        <img src="/static/assets/img/{{.ThreadJS}}.jpg" alt="{{.ThreadJS}}">
                                    </div>
                                </a>
                            </article>
                            <article class="carousel-slide">
                                <a href="/{{.ThreadID}}" class="read-more-btn">
                                    <div class="image-wrapper">
                                        <img src="/static/assets/img/{{.ThreadJS}}.jpg" alt="{{.ThreadJS}}">
                                    </div>
                                </a>
                            </article>
                        </div>

                        <button class="carousel-btn next" type="button" aria-label="Suivant">&#8594;</button>
                    </div>

                    <div class="carousel-dots" aria-label="Navigation du carrousel">
                        <button class="dot active" data-slide="0" aria-label="Slide 1"></button>
                        <button class="dot" data-slide="1" aria-label="Slide 2"></button>
                        <button class="dot" data-slide="2" aria-label="Slide 3"></button>
                    </div>
                </section>
            </main>

            <footer class="site-footer">
                <p>© 2026 NBA TalkZone — Le forum n°1 en France pour les fans de NBA.</p>
                <div class="footer-links">
                    <a href="/mentions">Mentions légales</a>
                    <span>·</span>
                    <a href="/contact">Contact</a>
                </div>
            </footer>

        </div>

        <div class="side-band band-red"></div>
    </div>

</body>
</html>
{{end}}
